```html
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator 9.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81,#581c87);
  min-height:100vh;
  color:white;
  padding:20px;
}
.container{
  max-width:850px;
  margin:30px auto;
  background:#ffffff12;
  border:1px solid #ffffff25;
  border-radius:20px;
  padding:28px;
  backdrop-filter:blur(12px);
}
h1{text-align:center;color:#facc15;margin-bottom:10px}
.subtitle{text-align:center;color:#ddd;margin-bottom:25px}
input,select{
  width:100%;
  padding:14px;
  margin:9px 0 16px;
  border:0;
  border-radius:9px;
  font-size:15px;
  background:#fff;
  color:#222;
}
label{font-weight:bold}
button{
  border:0;
  padding:13px 20px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
  background:#facc15;
  color:#222;
  margin:5px 0;
}
button:hover{background:#fde68a}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{width:100%;background:#22c55e;color:white}
.primary:hover{background:#16a34a}
.card{
  background:#ffffff12;
  border:1px solid #ffffff25;
  border-radius:13px;
  padding:20px;
  margin-top:18px;
}
.option{
  display:block;
  padding:13px;
  margin-top:10px;
  border:1px solid #ffffff40;
  border-radius:9px;
  cursor:pointer;
}
.option:hover{background:#ffffff20}
.option input{width:auto;margin:0 10px 0 0}
.option.correct{background:#15803d70;border-color:#22c55e}
.option.wrong{background:#b91c1c70;border-color:#ef4444}
#quizArea,#resultArea{display:none}
#status{text-align:center;margin:15px;color:#fde68a}
#feedback{margin-top:12px;line-height:1.6}
.progress{
  height:9px;
  background:#ffffff30;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}
#progressBar{
  height:100%;width:0;background:#22c55e;
}
.score{text-align:center;font-size:40px;color:#facc15}
.small{text-align:center;color:#ccc;font-size:12px;margin-top:20px}
</style>
</head>

<body>
<div class="container">

<h1>🚀 AI QUIZ GENERATOR 9.0</h1>
<p class="subtitle">Create Your Own AI Powered Quiz!</p>

<div id="setupArea">

<label>🔑 Groq API Key</label>
<input type="password" id="apiKey" placeholder="Enter your Groq API Key">

<label>📚 Enter Quiz Topic</label>
<input id="topic" placeholder="Example: Python, HTML, Science, JavaScript">

<label>🎯 Difficulty Level</label>
<select id="difficulty">
<option>Easy</option>
<option selected>Medium</option>
<option>Hard</option>
</select>

<label>❓ Number of Questions</label>
<select id="count">
<option value="5">5 Questions</option>
<option value="10" selected>10 Questions</option>
<option value="15">15 Questions</option>
</select>

<button class="primary" id="generateBtn" onclick="generateQuiz()">
✨ Generate AI Quiz
</button>

</div>

<div id="status"></div>

<div id="quizArea">
<div class="progress"><div id="progressBar"></div></div>
<div id="questionInfo"></div>
<div class="card">
<h3 id="question"></h3>
<div id="options"></div>
<div id="feedback"></div>
</div>
<button id="nextBtn" class="primary" onclick="nextQuestion()" disabled>
Next Question ➜
</button>
</div>

<div id="resultArea" class="card">
<h2 style="text-align:center">🎉 Quiz Completed!</h2>
<div class="score" id="finalScore"></div>
<p id="resultMessage" style="text-align:center;margin:15px"></p>
<button class="primary" onclick="location.reload()">🔄 Play Again</button>
</div>

<p class="small">AI Quiz Generator 9.0 | Powered by Groq API</p>
</div>

<script>
let questions = [];
let current = 0;
let score = 0;
let answered = false;

async function generateQuiz(){

 const apiKey = document.getElementById("apiKey").value.trim();
 const topic = document.getElementById("topic").value.trim();
 const difficulty = document.getElementById("difficulty").value;
 const count = Number(document.getElementById("count").value);

 if(!apiKey){
   alert("Please enter your Groq API Key!");
   return;
 }

 if(!topic){
   alert("Please enter a quiz topic!");
   return;
 }

 const btn = document.getElementById("generateBtn");
 btn.disabled = true;
 btn.innerText = "⏳ Generating Quiz...";
 document.getElementById("status").innerText =
 "AI is preparing your questions. Please wait...";

 try{

 const response = await fetch(
 "https://api.groq.com/openai/v1/chat/completions",
 {
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+apiKey
  },
  body:JSON.stringify({
   model:"llama-3.3-70b-versatile",
   messages:[
    {
     role:"system",
     content:`You are an expert quiz generator.
     Return ONLY valid JSON.
     Do not use markdown or code fences.
     Format:
     {
       "questions":[
         {
           "question":"Question text",
           "options":["A","B","C","D"],
           "answer":0,
           "explanation":"Explanation"
         }
       ]
     }
     answer must be the zero-based index of the correct option.
     Generate exactly the requested number of questions.
     Make all questions factually correct.
     `
    },
    {
     role:"user",
     content:`Generate ${count} multiple choice questions.
     Topic: ${topic}
     Difficulty: ${difficulty}
     Language: Hindi.
     Include four options and explanations.
     `
    }
   ],
   temperature:0.7,
   max_completion_tokens:5000,
   response_format:{type:"json_object"}
  })
 });

 const data = await response.json();

 if(!response.ok){
   throw new Error(data.error?.message || "Groq API request failed");
 }

 const content = data.choices?.[0]?.message?.content;

 if(!content) throw new Error("AI returned an empty response.");

 const parsed = JSON.parse(content);

 if(!Array.isArray(parsed.questions) ||
    parsed.questions.length !== count){
   throw new Error("AI returned an invalid number of questions. Please retry.");
 }

 questions = parsed.questions.map(q=>{
   if(typeof q.question !== "string" ||
      !Array.isArray(q.options) ||
      q.options.length !== 4 ||
      !Number.isInteger(q.answer) ||
      q.answer < 0 || q.answer > 3){
     throw new Error("AI returned an invalid question format.");
   }
   return q;
 });

 current = 0;
 score = 0;

 document.getElementById("setupArea").style.display="none";
 document.getElementById("status").innerText="";
 document.getElementById("quizArea").style.display="block";

 showQuestion();

 }catch(error){
   document.getElementById("status").innerText =
   "❌ Error: "+error.message;
 }finally{
   btn.disabled=false;
   btn.innerText="✨ Generate AI Quiz";
 }
}

function showQuestion(){

 answered = false;

 const q = questions[current];

 document.getElementById("questionInfo").innerText =
 `Question ${current+1} of ${questions.length}`;

 document.getElementById("question").innerText = q.question;

 document.getElementById("progressBar").style.width =
 ((current+1)/questions.length*100)+"%";

 document.getElementById("feedback").innerText="";
 document.getElementById("nextBtn").disabled=true;

 const options = document.getElementById("options");
 options.innerHTML="";

 q.options.forEach((option,index)=>{

   const label = document.createElement("label");
   label.className="option";

   const radio = document.createElement("input");
   radio.type="radio";
   radio.name="answer";
   radio.value=index;

   radio.addEventListener("change",()=>checkAnswer(index));

   label.appendChild(radio);
   label.appendChild(document.createTextNode(option));
   options.appendChild(label);
 });
}

function checkAnswer(selected){

 if(answered) return;
 answered=true;

 const q=questions[current];
 const labels=document.querySelectorAll(".option");

 labels.forEach((label,index)=>{
   label.querySelector("input").disabled=true;

   if(index===q.answer){
     label.classList.add("correct");
   }

   if(index===selected && selected!==q.answer){
     label.classList.add("wrong");
   }
 });

 const feedback=document.getElementById("feedback");

 if(selected===q.answer){
   score++;
   feedback.innerHTML="✅ <b>Correct Answer!</b>";
 }else{
   feedback.innerHTML="❌ <b>Wrong Answer!</b><br>Correct Answer: "+
   q.options[q.answer];
 }

 feedback.innerHTML += "<br><br>💡 Explanation: "+
 (q.explanation || "Review this concept for better understanding.");

 document.getElementById("nextBtn").disabled=false;
}

function nextQuestion(){

 if(!answered) return;

 current++;

 if(current<questions.length){
   showQuestion();
 }else{
   showResult();
 }
}

function showResult(){

 document.getElementById("quizArea").style.display="none";
 document.getElementById("resultArea").style.display="block";

 const percentage=Math.round(score/questions.length*100);

 document.getElementById("finalScore").innerText =
 score+" / "+questions.length;

 document.getElementById("resultMessage").innerText =
 "Your Score: "+percentage+"% — "+
 (percentage>=80?"Excellent Performance! 🏆":
 percentage>=50?"Good Job! 👍":
 "Keep Practicing! 💪");
}
</script>
</body>
</html>
